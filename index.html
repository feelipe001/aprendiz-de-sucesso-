<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendiz de Sucesso - 2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Estilos da Página Baseados na Identidade Visual */
        :root {
            --azul-projeto: #0040A1;
            --verde-projeto: #9BC836;
            --branco: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--azul-projeto);
            font-family: 'Montserrat', sans-serif;
            color: var(--branco);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px; 
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            color: var(--verde-projeto);
            font-weight: 900;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 25px;
        }

        .headline {
            margin-bottom: 30px;
        }

        .headline h2 {
            font-size: 1.5rem;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .headline p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 400;
            line-height: 1.5;
        }

        .video-section {
            margin-bottom: 35px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .cta-section {
            margin: 20px 0;
        }

        .cta-section h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .btn-whatsapp {
            display: inline-block;
            background-color: var(--verde-projeto);
            color: var(--azul-projeto);
            padding: 18px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(155, 200, 54, 0.4);
            transition: transform 0.2s ease;
            width: 100%;
            cursor: pointer;
        }

        .btn-whatsapp:hover {
            transform: scale(1.03);
        }

        /* --- Efeito de Pulso na Imagem --- */
        .image-container {
            margin: 40px 0;
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .pulsing-image {
            width: 100%;
            max-width: 100%;
            border-radius: 15px;
            position: relative;
            z-index: 2;
            display: block;
        }

        .pulse-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            background-color: var(--verde-projeto);
            border-radius: 15px;
            z-index: 1;
            animation: pulse-minimal 2.5s infinite ease-in-out;
            filter: blur(15px);
            opacity: 0.3;
        }

        @keyframes pulse-minimal {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.2; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.2; }
        }

        /* --- ESTILOS DO VÍDEO (ORIGINAIS) --- */
        #vsl-container { position: relative; max-width: 100%; height: auto; }
        .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; }
        #player-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #contextBlocker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: auto; }
        .overlay-audio, .overlay-pause { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; text-align: center; z-index: 4; flex-direction: column; font-family: sans-serif; }
        .overlay-audio { background: transparent; }
        .audio-content { background: #4564FF; padding: 30px; border: solid 2px white; border-radius: 16px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; align-items: center; cursor: pointer; max-width: 300px; width: 100%; animation: fadeIn 0.8s ease; }
        .audio-content p { margin: 8px 0; color: white; font-size: 1.2em; font-weight: bold; text-align: center; }
        .icon-container { display: flex; justify-content: center; align-items: center; }
        .volume-video { width: 100px; height: 100px; border-radius: 8px; pointer-events: none; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .overlay-pause { display: none; background-color: transparent; }
        .pause-play-button { width: 90px; height: 90px; background: #4564FFE0; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0, 0, 0, 0.25); cursor: pointer; transition: background 0.3s ease, transform 0.2s ease; }
        .pause-play-button:hover { background: #4564FF; transform: scale(1.05); }
        .pause-icon { margin-right: -2px; width: 32px; height: 32px; }
        .progress-bar { height: 6px; background: white; width: 0%; position: absolute; bottom: 0; left: 0; z-index: 2; transition: width 0.2s ease; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Aprendiz de Sucesso</h1>
    </header>

    <section class="headline">
        <h2>Transforme seu futuro agora</h2>
        <p>Aprenda. Empreenda. Realize o seu projeto em 2027.</p>
    </section>

    <section class="video-section">
        <div id="vsl-container">
          <div class="video-wrapper">
            <div id="player-wrapper">
              <div id="player"></div>
              <div id="contextBlocker"></div>
            </div>
            <div class="overlay-audio" id="audioOverlay">
              <div class="audio-content" id="unmuteBtn">
                <p>Clique aqui</p>
                <div class="icon-container">
                  <video src="https://zeph.com.br/wp-content/uploads/2025/06/21volume.mp4" autoplay muted loop playsinline class="volume-video"></video>
                </div>
                <p>para ativar o som</p>
              </div>
            </div>
            <div class="overlay-pause" id="pauseOverlay">
              <div id="resumeBtn" class="pause-play-button">
                <img src="https://zeph.com.br/wp-content/uploads/2025/06/play-button-arrowhead.svg" class="pause-icon" />
              </div>
            </div>
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
    </section>

    <section class="cta-section">
        <h3>Venha fazer parte 2027</h3>
        <a href="https://wa.me/5512991599185?text=Olá!%20Tenho%20interesse%20no%20projeto%20Aprendiz%20de%20Sucesso%202027." class="btn-whatsapp" target="_blank">
            QUERO ME INSCREVER AGORA
        </a>
    </section>

    <div class="image-container">
        <div class="pulse-effect"></div>
        <img src="https://res.cloudinary.com/dxpygpngo/image/upload/v1777484972/0660c1a4-d589-4ae3-8dfd-78c2807b4cca_xqn7jv.png" alt="Transforme seu Futuro" class="pulsing-image">
    </div>

    <section class="cta-section">
        <a href="https://wa.me/5512991599185?text=Olá!%20Vi%20a%20oportunidade%20para%202027%20e%20quero%20começar." class="btn-whatsapp" target="_blank">
            GARANTIR MINHA VAGA EM 2027
        </a>
    </section>
</div>

<script>
    // SCRIPT ORIGINAL DO PLAYER (SEM ALTERAÇÕES)
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    let player, interval;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'Wl4JTfAN91Q',
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'mute': 1,
          'rel': 0,
          'modestbranding': 1,
          'showinfo': 0,
          'enablejsapi': 1,
          'fs': 0,
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      event.target.playVideo();
      updateProgress();
    }

    function updateProgress() {
      interval = setInterval(() => {
        if (player && player.getDuration) {
          const duration = player.getDuration();
          const current = player.getCurrentTime();
          const percent = (current / duration) * 100;
          document.getElementById("progressBar").style.width = percent + "%";
        }
      }, 500);
    }

    document.getElementById("unmuteBtn").addEventListener("click", () => {
      player.unMute();
      player.seekTo(0);
      player.playVideo();
      document.getElementById("audioOverlay").style.display = "none";
    });

    document.getElementById("resumeBtn").addEventListener("click", () => {
      player.playVideo();
      document.getElementById("pauseOverlay").style.display = "none";
    });

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PAUSED) {
        document.getElementById("pauseOverlay").style.display = "flex";
      } else {
        document.getElementById("pauseOverlay").style.display = "none";
      }
    }

    const blocker = document.getElementById("contextBlocker");
    blocker.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    blocker.addEventListener("click", function () {
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) { player.pauseVideo(); } else { player.playVideo(); }
    });

    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>

</body>
</html>
